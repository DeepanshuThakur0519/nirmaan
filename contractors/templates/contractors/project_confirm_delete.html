{% extends "contractors/base.html" %}

{% block title %}Delete project | Nirmaan{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1>Delete this project?</h1>
    <p class="muted">"{{ project.title }}" and its photos will be removed from your portfolio. This cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-gold btn-block">Yes, delete it</button>
    </form>

    <p class="auth-switch"><a href="{% url 'contractors:dashboard' %}">Cancel</a></p>
  </div>
</section>
{% endblock %}
